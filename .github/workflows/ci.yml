name: CI

# Runs on every push to main and on every pull request. The workflow has no secrets and needs nothing beyond a
# GitHub-hosted runner: the smoke suite boots the gateway against test/stub-opencode.mjs, so the real OpenCode CLI
# is never installed or authenticated here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A superseded run is cancelled on a pull request, where only the newest head is worth a runner. A push to main is
  # never cancelled: the publish gate in docker-publish.yml requires at least one *completed* check run with a
  # successful conclusion on the tagged SHA, and a cancelled run concluded `cancelled` - so a commit whose run was
  # superseded by the next push could never be released.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # The job name is part of the branch protection required checks on main: keep it in the
    # "Test on Node <version>" form when changing the matrix
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # package.json requires Node >= 20; the matrix covers the oldest supported line, the LTS used by the
        # official Docker image, and the current release line
        node: ['20', '22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No step in this job talks to the remote (every git call is local), so the token is only ever a liability:
          # left in .git/config it is readable by anything that runs in the workspace.
          # A shallow checkout is enough here: the step that judged a commit *range* moved to the `commit-messages`
          # job below, and nothing left in this job reads history.
          persist-credentials: false

      # No `version` input: the action installs the pnpm release pinned by "packageManager" in package.json
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Advisory, never a gate: the audit needs the registry, so a network hiccup or a finding nobody has fixed yet
      # would fail a pull request that changed nothing about dependencies. `continue-on-error` keeps the report in the
      # log while the required checks stay about the code, and the bumps it names are a manual, reviewed change: this
      # repository has no bump bot (`AGENTS.md` invariant 7 - there is no .github/dependabot.yml and none comes back).
      # One matrix entry runs it: three identical reports per push cost runner time and tell nobody anything new.
      - name: Dependency audit (advisory)
        if: matrix.node == '22'
        continue-on-error: true
        run: pnpm audit --audit-level high

      - name: Syntax check
        run: pnpm run check

      # Shellcheck is a runner tool, not a project dependency: ubuntu-latest ships apt and its universe repository
      # carries the package, so the entrypoint is linted without adding anything to package.json. `sh -n` only parses,
      # which is why a script with a real defect still passed it; `-S warning` adds the checks that name one (an
      # unquoted expansion, a command that can fail unnoticed) and `-s sh` selects the POSIX dialect the shebang
      # declares.
      - name: Shell check (container entrypoint)
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          sh -n docker/docker-entrypoint.sh
          shellcheck -S warning -s sh docker/docker-entrypoint.sh

      # Supply chain: the publishing workflow leaves a Docker Hub token with write scope on the runner, so an action
      # resolved through a movable major tag is code nobody reviewed at a version nobody froze (a retagged
      # `docker/build-push-action` runs right after `docker/login-action` and can push). Every `uses:` must name a full
      # 40-character commit SHA with the release in a trailing comment. The pattern is spelled `us[e]s:` so this step
      # does not match the text of the steps around it.
      - name: Workflow actions are pinned to commit SHAs
        run: |
          status=0
          # The reference is read wherever `uses:` sits on the line, not only at the start: a flow-style step
          # (`- { name: Checkout, uses: actions/checkout@v4 }`) begins with `{` and used to pass unseen.
          files=$(ls .github/workflows/*.yml .github/workflows/*.yaml .github/workflows/*/*.yml 2>/dev/null || true)
          # An empty list means the globs matched nothing, and the loop below then checks no file and exits 0: a
          # workflow directory that moved would have quietly stopped policing pins. `|| true` is still needed above
          # (a partial match makes `ls` exit non-zero while printing what it found), so the emptiness is what is
          # asserted here.
          if [ -z "$files" ]; then
            echo "no workflow file matched: the pin gate would check nothing"
            exit 1
          fi
          for file in $files; do
            [ -f "$file" ] || continue
            # A comment that explains the rule must not be read as a use of an action (`:[[:space:]]*#` is a line
            # whose content starts with `#`, which no step does)
            hits=$(grep -nE 'us[e]s:[[:space:]]*[^[:space:]#},]+' "$file" | grep -vE ':[[:space:]]*#' || true)
            [ -n "$hits" ] || continue
            # A reference with no `@` is not pinned either: `docker://alpine:3` moves on every pull, and a local action
            # (`./.github/actions/x`) is only as frozen as the checkout it comes from. A bare SHA is not enough on its
            # own: the release has to be written next to it, or a reviewer cannot tell a frozen v4.4.0 from a commit
            # that was never released.
            unpinned=$(printf '%s\n' "$hits" | grep -vE 'us[e]s:[[:space:]]*[^[:space:]#}@]+@[0-9a-f]{40}([[:space:]]+|[[:space:]]*[,}])+#[[:space:]]*v[0-9]' || true)
            if [ -n "$unpinned" ]; then
              echo "::error file=$file::an action is referenced by a movable ref (no 40-character commit SHA), or its SHA has no '# vX.Y.Z' release comment"
              printf '%s\n' "$unpinned"
              status=1
            fi
          done
          test "$status" = "0" || exit 1
          echo "every action reference is pinned to a 40-character commit SHA with its release in a comment"

      - name: Smoke test (OpenAI contract)
        run: pnpm test

  # Its own job rather than one step inside the matrix above, where it was gated on `if: matrix.node == '24'`: a gate
  # keyed to a matrix value disappears with the value, so dropping or renaming that Node line silently stopped checking
  # commit messages while the branch protection still required the check by name. The job name is the check name now,
  # so it no longer depends on any matrix entry. It is independent of the other jobs and needs nothing from them.
  commit-messages:
    name: Commit messages follow the convention
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing in this job talks to the remote with a credential: the fetches below are anonymous reads of a
          # public repository, and a token left in .git/config is readable by anything that runs in the workspace.
          persist-credentials: false
          # Full history, because the step below judges a *range*: with the default depth of 1 the fetched base
          # (`github.event.before`, a pull request's base SHA) is a second shallow graft and
          # `git rev-list before..HEAD` answers only the tip - a two-commit push had its first subject checked by nobody.
          # The repository is small; a complete fetch costs a second.
          fetch-depth: 0

      # No `version` input: the action installs the pnpm release pinned by "packageManager" in package.json
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The Node line this step ran on while it lived in the matrix (`if: matrix.node == '24'`)
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The convention in CONTRIBUTING.md is only as good as the check that sees it before the commit lands: a subject
      # over 72 characters, an undocumented scope or a generated merge title cannot be corrected afterwards without
      # rewriting published history. Only the commits this run adds are checked - the range starts at the pull
      # request's base, or at the previous tip of `main` for a push - because history that already shipped is not
      # something a contributor can fix.
      - name: Commit messages follow the convention
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$PUSH_BEFORE" in ''|0000000000000000000000000000000000000000) PUSH_BEFORE='' ;; esac
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # A dispatch checks out a branch tip that has already shipped. The fallback below would judge the default
            # `HEAD~1..HEAD` range, which is not one commit on `main` - it spans the merge and everything it brought in -
            # so a manual run re-opened history nobody can reword and could go red on commits that already passed.
            echo "manual dispatch: the checked-out history has already shipped, nothing to check"
            exit 0
          fi
          range=''
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # refs/pull/<n>/head lives in the base repository, so it reaches a fork's commits - fetching the head SHA
            # would not, and actions/checkout fetched a single commit anyway
            if git fetch --no-tags --quiet origin "+refs/pull/$PR_NUMBER/head:refs/remotes/pr-head" &&
               git fetch --no-tags --quiet origin "$PR_BASE" 2>/dev/null; then
              range="$PR_BASE..refs/remotes/pr-head"
            fi
          elif [ -n "$PUSH_BEFORE" ] && git fetch --no-tags --quiet origin "$PUSH_BEFORE" 2>/dev/null; then
            range="$PUSH_BEFORE..HEAD"
          fi
          if [ -n "$range" ]; then
            echo "checking $range"
            pnpm run check:commits "$range"
          else
            # A dispatch, a branch whose first push has no previous tip, or a range that could not be fetched: the
            # checked-out commit is still checked
            echo "checking the checked-out commit only"
            pnpm run check:commits
          fi

  docker:
    # Also referenced by the branch protection required checks on main
    name: Build the container image
    runs-on: ubuntu-latest
    # The job now builds the image three times: once for the runner's architecture (the container assertions run
    # against it) and once for both published architectures, where the arm64 half is emulated under QEMU and takes
    # several times as long as the native build. Twenty minutes was the budget for the native build alone.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing in this job pushes or fetches: the token would only sit in .git/config
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # arm64 is built on an amd64 runner, so the QEMU binfmt handlers have to be registered before a build names a
      # foreign platform - without them the arm64 `RUN` steps fail with "exec format error"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      # Build only (no registry push): proves the Dockerfile and the pnpm install path still work
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: free-opencode-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The publish workflow (docker-publish.yml) builds linux/amd64 + linux/arm64, so until now a Dockerfile that only
      # builds for the runner's own architecture was discovered after a tag had been pushed and the registry login had
      # already happened. This is the same build with both published platforms and no registry involved: it proves the
      # Dockerfile still builds for each architecture the release ships.
      # `load` is deliberately absent - the local daemon holds one architecture, so a multi-platform result cannot be
      # loaded into it, and nothing below starts a container from this build. The container assertions use the native
      # image built above (`free-opencode-api:ci`), which is the one that has to run on this runner.
      - name: Build image for both published architectures
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          # Its own cache scope: both builds share the repository's type=gha cache, and two writers on one scope would
          # let the emulated arm64 layers overwrite the native ones the build above just cached
          cache-from: type=gha,scope=multiarch
          cache-to: type=gha,mode=max,scope=multiarch

      # The image must not run as root: the gateway, the backend it spawns and every tool that backend runs would
      # otherwise all be UID 0. `--entrypoint id` bypasses the image entrypoint, so this reads the user the image
      # declares (docker/Dockerfile: `USER node`), not the user of this step.
      - name: Container runs as a non-root user
        run: |
          id_line=$(docker run --rm --entrypoint id free-opencode-api:ci)
          echo "container user -> $id_line"
          uid=$(printf '%s\n' "$id_line" | sed -E 's/.*uid=([0-9]+).*/\1/')
          case "$uid" in
            ''|*[!0-9]*) echo "could not read the uid from '$id_line'"; exit 1 ;;
          esac
          echo "uid inside the container -> $uid"
          test "$uid" != "0"

      # This is the container the later steps assert against: "The image's own HEALTHCHECK reports healthy" inspects it
      # by name and "Container enforces authentication" curls 127.0.0.1:8083, which is the port published here. The
      # removal first is what makes the job idempotent - a runner that kept the container (a re-run, a job that failed
      # before its teardown) would otherwise fail this step with "container name is already in use" - and the final
      # step of this job removes it again.
      - name: Container health check
        run: |
          docker rm -f gateway-ci >/dev/null 2>&1 || true
          docker run -d --name gateway-ci -p 127.0.0.1:8083:8083 free-opencode-api:ci
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 2 --connect-timeout 1 http://127.0.0.1:8083/health >/dev/null; then
              echo "gateway answered /health after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "gateway did not become healthy in 30s"
          docker logs gateway-ci
          exit 1

      # The image's own HEALTHCHECK (docker/Dockerfile) is what an orchestrator acts on: this asserts the container
      # reports `healthy` for itself, instead of re-implementing the probe with the runner's curl (which is how a
      # broken probe shipped silently). The probe is `--interval=30s --start-period=20s`, so this waits.
      - name: The image's own HEALTHCHECK reports healthy
        run: |
          for attempt in $(seq 1 60); do
            status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' gateway-ci)
            echo "attempt ${attempt}: health=$status"
            case "$status" in
              healthy) exit 0 ;;
              unhealthy)
                docker inspect --format '{{json .State.Health}}' gateway-ci
                docker logs gateway-ci
                exit 1
                ;;
            esac
            sleep 2
          done
          echo "the container never reported healthy"
          docker inspect --format '{{json .State.Health}}' gateway-ci
          docker logs gateway-ci
          exit 1

      # The entrypoint writes -e values into /app/config.json, but the environment must still beat the stored file
      # (docker/README.md: environment > config.json > defaults). A fresh container cannot prove that: its entrypoint
      # writes the same -e values into the file, so both sources agree and the assertion passes either way. This
      # mounts a config.json that *disagrees* with -e, so the environment beating the file is observable.
      - name: The environment beats a stored config.json
        run: |
          mkdir -p "$RUNNER_TEMP/ci-config"
          # BIND_HOST is in the file because the gateway's own default is 127.0.0.1: a fixture without it would bind
          # loopback inside the container and the published ports below would never answer
          printf '%s\n' '{ "PORT": "8086", "API_KEY": "sk-from-file", "BIND_HOST": "0.0.0.0", "OPENCODE_BIND_HOST": "127.0.0.1" }' \
            > "$RUNNER_TEMP/ci-config/config.json"
          chmod 644 "$RUNNER_TEMP/ci-config/config.json"
          # PORT is -e 8084 (the file says 8086) and API_KEY is -e sk-from-env (the file says sk-from-file)
          docker run -d --name gateway-ci-env -p 127.0.0.1:8084:8084 \
            -v "$RUNNER_TEMP/ci-config/config.json:/app/config.json:ro" \
            -e PORT=8084 -e API_KEY=sk-from-env free-opencode-api:ci
          healthy=0
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 2 --connect-timeout 1 http://127.0.0.1:8084/health >/dev/null; then
              echo "gateway answered /health on 8084 (the -e PORT) after ${attempt}s"
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" != "1" ]; then
            echo "nothing answered on 8084: the stored PORT was used instead of -e PORT"
            docker logs gateway-ci-env
            exit 1
          fi
          code=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer sk-from-file' http://127.0.0.1:8084/v1/models)
          echo "GET /v1/models with the stored key -> $code (expected 401: -e API_KEY won)"
          test "$code" = "401"
          code=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer sk-from-env' http://127.0.0.1:8084/v1/models)
          echo "GET /v1/models with the -e key -> $code"
          test "$code" = "200"

      # Without -e the stored file is the fallback (environment > config.json > default), and the image's own
      # HEALTHCHECK has to read the port from that file: a probe that only looks at the environment reported this
      # container unhealthy forever.
      - name: The stored config.json is used when nothing is passed in
        run: |
          docker rm -f gateway-ci-file >/dev/null 2>&1 || true
          docker run -d --name gateway-ci-file -p 127.0.0.1:8086:8086 \
            -v "$RUNNER_TEMP/ci-config/config.json:/app/config.json:ro" free-opencode-api:ci
          for attempt in $(seq 1 60); do
            status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' gateway-ci-file)
            echo "attempt ${attempt}: health=$status"
            case "$status" in
              healthy) break ;;
              unhealthy) docker logs gateway-ci-file; exit 1 ;;
            esac
            sleep 2
          done
          docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' gateway-ci-file | grep -qx healthy
          code=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer sk-from-file' http://127.0.0.1:8086/v1/models)
          echo "GET /v1/models with the stored key on the stored port -> $code"
          test "$code" = "200"

      # The generated file carries the API key: it must be 0600 and owned by the runtime user, and the backend it
      # starts must listen on loopback (it has no authentication of its own).
      - name: The generated config is private and keeps the backend on loopback
        run: |
          docker rm -f gateway-ci-fresh >/dev/null 2>&1 || true
          docker run -d --name gateway-ci-fresh free-opencode-api:ci
          # Wait for the entrypoint to write /app/config.json instead of guessing: `sleep 2` is a race against a
          # container start (image pull-less but still a fresh overlay), and a slow runner answered the `stat` with
          # "No such file or directory" - a failure about a step that had not run yet.
          for attempt in $(seq 1 60); do
            if docker exec gateway-ci-fresh test -f /app/config.json; then
              echo "config.json written after ${attempt}s"
              break
            fi
            sleep 1
          done
          docker exec gateway-ci-fresh test -f /app/config.json
          mode=$(docker exec gateway-ci-fresh stat -c '%a' /app/config.json)
          echo "mode of /app/config.json inside the container -> $mode"
          test "$mode" = "600"
          owner=$(docker exec gateway-ci-fresh stat -c '%u' /app/config.json)
          echo "owner uid of /app/config.json -> $owner"
          test "$owner" = "1000"
          bind=$(docker exec gateway-ci-fresh node -p "require('/app/config.json').OPENCODE_BIND_HOST")
          echo "OPENCODE_BIND_HOST in the generated config -> $bind"
          test "$bind" = "127.0.0.1"

      # The image bundles the CLI that the gateway drives: prove the bundled `opencode serve` still exposes the 2.x
      # session API the gateway calls (`POST /api/session`). A 1.x release answers 404 there - it has no `/api` route at
      # all - and no other step here would notice, because a 1.x server also answers `/health` with HTML, so a plain
      # readiness probe passes on it. This is what a `latest` CLI install that moved backwards would ship.
      # The server password is pinned through the environment so the request can authenticate: 2.x answers 401 without
      # it, and the gateway reads the same variable (`OPENCODE_SERVER_PASSWORD`) for the child it spawns.
      # It runs in its own container rather than through `docker exec`: a detached exec keeps the CLI's output out of
      # `docker logs`, so a failure reported only "fetch failed" with nothing to read, and sharing the gateway
      # container's HOME means sharing its backend state for no reason.
      # Every curl here carries its own timeout: a CLI that accepts the connection and never answers (a wedged
      # `opencode serve`) parked the retry loop on a request with no deadline, so the step sat until the job's 20
      # minute timeout and the retry budget it exists for never ran. The deadline has to be *larger* than the one the
      # gateway itself runs on: `/v1/models` gives up after `METADATA_TIMEOUT_CAP_MS` (10 s) and falls back to the
      # static model, so a 10 s curl timeout raced it and failed with exit 28 on a container that was about to answer.
      - name: Bundled CLI exposes the session API
        run: |
          docker run -d --name cli-session-check -p 127.0.0.1:4599:4599 -e OPENCODE_SERVER_PASSWORD=ci-check-password \
            --entrypoint opencode free-opencode-api:ci serve --port 4599 --hostname 0.0.0.0
          for attempt in $(seq 1 60); do
            if body=$(curl -fsS --max-time 3 --connect-timeout 1 -u opencode:ci-check-password -X POST \
                -H 'content-type: application/json' -d '{}' http://127.0.0.1:4599/api/session 2>/dev/null); then
              echo "bundled opencode created a session: $body"
              echo "$body" | grep -q '"id"'
              exit 0
            fi
            sleep 1
          done
          echo "the bundled opencode CLI did not answer POST /api/session"
          docker ps -a --filter name=cli-session-check
          docker logs cli-session-check || true
          exit 1

      # The image must behave like the source tree: the root index answers without a key and everything else
      # is authenticated with the built-in key. This talks to the container "Container health check" started - the
      # published 127.0.0.1:8083 is that container, not a fresh one - so the step only means anything after it.
      - name: Container enforces authentication
        run: |
          root=$(curl -fsS --max-time 30 http://127.0.0.1:8083/)
          echo "GET / -> $root"
          echo "$root" | grep -q 'free-opencode-api'
          code=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' http://127.0.0.1:8083/v1/models)
          echo "GET /v1/models without a key -> $code"
          test "$code" = "401"
          code=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer sk-dummy-123' http://127.0.0.1:8083/v1/models)
          echo "GET /v1/models with the default key -> $code"
          test "$code" = "200"

      # The containers this job starts are removed here so the job leaves nothing behind and can be re-run: the step
      # above asserts against `gateway-ci`, and a second `docker run --name gateway-ci` would fail on the name that is
      # still taken. Every removal is best-effort - a container that never started is not a failure - and `always()`
      # keeps the teardown running when an earlier step failed and the job is already red.
      - name: Remove the CI containers
        if: always()
        run: |
          for name in gateway-ci gateway-ci-env gateway-ci-file gateway-ci-fresh cli-session-check; do
            docker rm -f "$name" >/dev/null 2>&1 || true
          done
          echo "removed the containers this job started"
