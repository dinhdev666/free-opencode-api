name: Publish image

# Publishes a multi-architecture image (linux/amd64 + linux/arm64) to Docker Hub. Triggered by pushing a version
# tag, so the released image always matches a reviewable commit. `workflow_dispatch` runs must be started from a tag
# ref as well (Actions -> Publish image -> Run workflow -> "Use workflow from" = the tag).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  Docker Hub account, for example dinhdev666
#   DOCKERHUB_TOKEN     Docker Hub access token with Read & Write scope (never the account password)
#
# CI (ci.yml) already builds the image on every push/PR without pushing it; this workflow only publishes.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: dinhdev666/free-opencode-api

jobs:
  publish:
    name: Publish the container image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $package_version"
            exit 1
          fi
          echo "publishing version $package_version"

      # arm64 is built on an amd64 runner, so the QEMU binfmt handlers have to be registered first
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # From the tag v1.2.3 this emits 1.2.3, 1.2 and latest (see the flavor default of latest=auto)
      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
