name: CI

# Runs on every push to main and on every pull request. The workflow has no secrets and needs nothing beyond a
# GitHub-hosted runner: the smoke suite boots the gateway against test/stub-opencode.mjs, so the real OpenCode CLI
# is never installed or authenticated here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The job name is part of the branch protection required checks on main: keep it in the
    # "Test on Node <version>" form when changing the matrix
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # package.json requires Node >= 20; the matrix covers the oldest supported line, the LTS used by the
        # official Docker image, and the current release line
        node: ['20', '22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # No `version` input: the action installs the pnpm release pinned by "packageManager" in package.json
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax check
        run: pnpm run check

      - name: Shell check (container entrypoint)
        run: sh -n docker/docker-entrypoint.sh

      # Supply chain: the publishing workflow leaves a Docker Hub token with write scope on the runner, so an action
      # resolved through a movable major tag is code nobody reviewed at a version nobody froze (a retagged
      # `docker/build-push-action` runs right after `docker/login-action` and can push). Every `uses:` must name a full
      # 40-character commit SHA with the release in a trailing comment. The pattern is spelled `us[e]s:` so this step
      # does not match the text of the steps around it.
      - name: Workflow actions are pinned to commit SHAs
        run: |
          status=0
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$file" ] || continue
            hits=$(grep -nE '^[[:space:]]*(-[[:space:]]+)?us[e]s:[[:space:]]*[^[:space:]#]+@[^[:space:]#]+' "$file" || true)
            [ -n "$hits" ] || continue
            unpinned=$(printf '%s\n' "$hits" | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)
            if [ -n "$unpinned" ]; then
              echo "::error file=$file::an action is referenced by a movable ref instead of a commit SHA"
              printf '%s\n' "$unpinned"
              status=1
            fi
          done
          test "$status" = "0" || exit 1
          echo "every action reference is pinned to a 40-character commit SHA"

      - name: Smoke test (OpenAI contract)
        run: pnpm test

  docker:
    # Also referenced by the branch protection required checks on main
    name: Build the container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Build only (no registry push): proves the Dockerfile and the pnpm install path still work
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: free-opencode-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image must not run as root: the gateway, the backend it spawns and every tool that backend runs would
      # otherwise all be UID 0. `--entrypoint id` bypasses the image entrypoint, so this reads the user the image
      # declares (docker/Dockerfile: `USER node`), not the user of this step.
      - name: Container runs as a non-root user
        run: |
          id_line=$(docker run --rm --entrypoint id free-opencode-api:ci)
          echo "container user -> $id_line"
          uid=$(printf '%s\n' "$id_line" | sed -E 's/.*uid=([0-9]+).*/\1/')
          case "$uid" in
            ''|*[!0-9]*) echo "could not read the uid from '$id_line'"; exit 1 ;;
          esac
          echo "uid inside the container -> $uid"
          test "$uid" != "0"

      - name: Container health check
        run: |
          docker run -d --name gateway-ci -p 8083:8083 free-opencode-api:ci
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 2 --connect-timeout 1 http://127.0.0.1:8083/health >/dev/null; then
              echo "gateway answered /health after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "gateway did not become healthy in 30s"
          docker logs gateway-ci
          exit 1

      # The entrypoint writes -e values into /app/config.json, but the environment must still beat the stored file
      # (docker/README.md: environment > config.json > defaults). This also proves the stored file, which carries the
      # API key, is not world readable.
      - name: Container honours -e and protects the stored config
        run: |
          docker run -d --name gateway-ci-env -p 8084:8084 -e PORT=8084 -e API_KEY=sk-from-env free-opencode-api:ci
          healthy=0
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 2 --connect-timeout 1 http://127.0.0.1:8084/health >/dev/null; then
              echo "gateway answered /health after ${attempt}s"
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" != "1" ]; then
            docker logs gateway-ci-env
            exit 1
          fi
          code=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer sk-dummy-123' http://127.0.0.1:8084/v1/models)
          echo "GET /v1/models with the built-in key -> $code (expected 401: -e API_KEY won)"
          test "$code" = "401"
          code=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer sk-from-env' http://127.0.0.1:8084/v1/models)
          echo "GET /v1/models with the -e key -> $code"
          test "$code" = "200"
          mode=$(docker exec gateway-ci-env stat -c '%a' /app/config.json)
          echo "mode of /app/config.json inside the container -> $mode"
          test "$mode" = "600"

      # The image bundles the CLI that the gateway drives: prove the bundled `opencode serve` still exposes the 1.x
      # session API. A 2.x release serves the web UI instead - it answers /health with HTML (so a readiness probe
      # passes) and 405 for POST /session (so every completion fails), and no other step here would notice: this is
      # what a `latest` CLI install shipped. Needs no provider credentials, only the local backend.
      # It runs in its own container rather than through `docker exec`: a detached exec keeps the CLI's output out of
      # `docker logs`, so a failure reported only "fetch failed" with nothing to read, and sharing the gateway
      # container's HOME means sharing its backend state for no reason.
      # Every curl here carries its own timeout: a CLI that accepts the connection and never answers (a wedged
      # `opencode serve`) parked the retry loop on a request with no deadline, so the step sat until the job's 20
      # minute timeout and the retry budget it exists for never ran. The deadline has to be *larger* than the one the
      # gateway itself runs on: `/v1/models` gives up after `METADATA_TIMEOUT_CAP_MS` (10 s) and falls back to the
      # static model, so a 10 s curl timeout raced it and failed with exit 28 on a container that was about to answer.
      - name: Bundled CLI exposes the session API
        run: |
          docker run -d --name cli-session-check -p 4599:4599 --entrypoint opencode \
            free-opencode-api:ci serve --port 4599 --hostname 0.0.0.0
          for attempt in $(seq 1 60); do
            if body=$(curl -fsS --max-time 3 --connect-timeout 1 -X POST -H 'content-type: application/json' \
                -d '{}' http://127.0.0.1:4599/session 2>/dev/null); then
              echo "bundled opencode created a session: $body"
              echo "$body" | grep -q '"id"'
              exit 0
            fi
            sleep 1
          done
          echo "the bundled opencode CLI did not answer POST /session"
          docker ps -a --filter name=cli-session-check
          docker logs cli-session-check || true
          exit 1

      # The image must behave like the source tree: the root index answers without a key and everything else
      # is authenticated with the built-in key
      - name: Container enforces authentication
        run: |
          root=$(curl -fsS --max-time 30 http://127.0.0.1:8083/)
          echo "GET / -> $root"
          echo "$root" | grep -q 'free-opencode-api'
          code=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' http://127.0.0.1:8083/v1/models)
          echo "GET /v1/models without a key -> $code"
          test "$code" = "401"
          code=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer sk-dummy-123' http://127.0.0.1:8083/v1/models)
          echo "GET /v1/models with the default key -> $code"
          test "$code" = "200"
