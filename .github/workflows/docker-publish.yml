name: Publish image

# Publishes a multi-architecture image (linux/amd64 + linux/arm64) to Docker Hub. Triggered by pushing a version
# tag, so the released image always matches a reviewable commit. A `workflow_dispatch` run is only published when it is
# started from a tag ref too (Actions -> Publish image -> Run workflow -> "Use workflow from" = the tag): the publish
# job itself carries `if: startsWith(github.ref, 'refs/tags/v')`, so a run from a branch stops before it logs in.
# Before anything is logged in or built, the tagged commit must be on `main` and carry only successful check runs, so a
# tag cannot publish a commit that never went through CI.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  Docker Hub account, for example dinhdev666
#   DOCKERHUB_TOKEN     Docker Hub access token with Read & Write scope (never the account password)
#
# CI (ci.yml) already builds the image on every push/PR without pushing it; this workflow only publishes.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  # Reading the check runs of the tagged commit, so a tag cannot publish a commit whose CI never ran or never passed
  checks: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: dinhdev666/free-opencode-api

jobs:
  publish:
    name: Publish the container image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A manual run from a branch used to go straight to login and push: the version check below is skipped for a
    # non-tag ref (`if: startsWith(github.ref, 'refs/tags/v')`), so nothing stopped a `workflow_dispatch` from main
    # from publishing an image with no release behind it. The job is refused unless the ref is a v*.*.* tag.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The ancestry test below walks real history: with the default depth of 1 both sides are shallow grafts and
          # `merge-base --is-ancestor` cannot answer
          fetch-depth: 0

      # A published image is what operators run, and the tag is the only thing that decides it: any `v*.*.*` tag on any
      # commit used to publish, including `latest`, whether or not that commit was on `main` or had ever passed CI.
      - name: The tag is on main and its CI passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # This job's own check run is on the commit as well, and while it runs it has no conclusion at all - so
          # counting every non-green run counted this one and failed every tag, including one whose CI was entirely
          # green. Evidence about the commit has to come from runs that finished, and never from this run.
          own="$GITHUB_RUN_ID"
          runs=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
            --jq '.check_runs[]
                  | select(.status == "completed")
                  | select((.html_url // "") | contains("/runs/'"$own"'/") | not)
                  | [.name, (.conclusion // "")] | @tsv')
          total=$(printf '%s\n' "$runs" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$total" = "0" ]; then
            echo "commit $SHA has no completed check runs from CI: let CI run on main before tagging it"
            exit 1
          fi
          failed=$(printf '%s\n' "$runs" | awk -F'\t' '$2 != "success" && $2 != "skipped" && $2 != "neutral" { print "  " $1 " (" $2 ")" }')
          if [ -n "$failed" ]; then
            echo "check run(s) on commit $SHA did not succeed; fix main and tag a green commit:"
            printf '%s\n' "$failed"
            exit 1
          fi
          echo "commit $SHA has $total completed check run(s), all green"

      - name: Verify the tag matches package.json
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $package_version"
            exit 1
          fi
          echo "publishing version $package_version"

      - name: The tagged commit is on main
        run: |
          git fetch --no-tags --quiet origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "commit $GITHUB_SHA is not on main; tag a commit that shipped"
            exit 1
          fi
          echo "commit $GITHUB_SHA is on main"

      # arm64 is built on an amd64 runner, so the QEMU binfmt handlers have to be registered first
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # From the tag v1.2.3 this emits 1.2.3 and latest (see the flavor default of latest=auto). Only whole
      # versions are published, so there is no floating "1" or "1.2" tag to keep in sync
      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A published image is something operators run; attest it. Provenance records how the image was built (the
          # commit, the workflow, the base image digest) and the SBOM lists what is inside it, so a CVE report can name
          # the packages this image actually contains instead of the ones the repository happens to declare. Both are
          # attached to the manifest list, which is also what makes the image inspectable by scanners.
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
